name: APK Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Icono de la app
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Banner para la pantalla de inicio de Android TV / Google TV
        run: |
          pip install --quiet pillow
          python3 - <<'EOF'
          import os
          from PIL import Image, ImageDraw, ImageFont
          W, H = 320, 180
          b = Image.new("RGB", (W, H), "#101A2E")
          ic = Image.open("icon-512.png").convert("RGBA").resize((116, 116), Image.LANCZOS)
          b.paste(ic, (18, 32), ic)
          d = ImageDraw.Draw(b)
          def fuente(t):
              for f in ["/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-Bold.ttf", "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"]:
                  if os.path.exists(f): return ImageFont.truetype(f, t)
              return ImageFont.load_default()
          d.text((150, 50), "TELE", font=fuente(40), fill="#E9EEF7")
          d.text((151, 98), "LORENZITO", font=fuente(22), fill="#FF5A4E")
          os.makedirs("android/app/src/main/res/drawable-xhdpi", exist_ok=True)
          b.save("android/app/src/main/res/drawable-xhdpi/banner.png")
          EOF

      - name: Firma (se crea la primera vez y se guarda para que las actualizaciones se instalen encima)
        run: |
          if [ ! -f android/firma.jks ]; then
            keytool -genkeypair -keystore android/firma.jks -alias tele -keyalg RSA -keysize 2048 -validity 36500 -storepass lorenzito -keypass lorenzito -dname "CN=Lorenzo Moreno, C=ES"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add android/firma.jks
            git commit -m "Firma de la app Android [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Compilar APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TELE-LORENZITO.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: TELE-LORENZITO Android ${{ github.run_number }}
          body: App Android de TELE-LORENZITO para el móvil y para la tele (Mi Box / Google TV). Descarga TELE-LORENZITO.apk e instálala.
          files: TELE-LORENZITO.apk
          make_latest: true
