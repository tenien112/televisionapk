name: APK Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Icono de la app
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Firma (se crea la primera vez y se guarda para que las actualizaciones se instalen encima)
        run: |
          if [ ! -f android/firma.jks ]; then
            keytool -genkeypair -keystore android/firma.jks -alias tele -keyalg RSA -keysize 2048 -validity 36500 -storepass lorenzito -keypass lorenzito -dname "CN=Lorenzo Moreno, C=ES"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add android/firma.jks
            git commit -m "Firma de la app Android [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Compilar APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TELE-LORENZITO.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: TELE-LORENZITO Android ${{ github.run_number }}
          body: App Android de TELE-LORENZITO. Descarga TELE-LORENZITO.apk desde el móvil e instálala.
          files: TELE-LORENZITO.apk
          make_latest: true
